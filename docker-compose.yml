  account-service:
    image: ${AWS_ECR_REGISTRY}/account-service:latest
    container_name: account-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: ${POSTGRES_ACCOUNT_URL}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SECURITY_JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - banking-network

  authentication-service:
    image: ${AWS_ECR_REGISTRY}/authentication-service:latest
    container_name: authentication-service
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: ${POSTGRES_AUTH_URL}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_SERVICE_SERVER: 8089
      SECURITY_JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - redis
      - kafka
    restart: unless-stopped
    networks:
      - banking-network

  community-account-service:
    image: ${AWS_ECR_REGISTRY}/community-account-service:latest
    container_name: community-account-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: ${POSTGRES_COMMUNITY_ACCOUNT_URL}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_GROUP_ID: community-account-service-group
      SECURITY_JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - banking-network

  customer-service:
    image: ${AWS_ECR_REGISTRY}/customer-service:latest
    container_name: customer-service
    ports:
      - "8086:8086"
    environment:
      CUSTOMER_SERVER: 8086
      SPRING_DATASOURCE_URL: ${POSTGRES_AUTH_URL}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_GROUP_ID: customer-service-group
      SECURITY_JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - banking-network

