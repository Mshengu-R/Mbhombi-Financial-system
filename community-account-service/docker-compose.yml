version: '3.8'
services:
  community-account-service:
    build: .
    ports:
      # CHANGED: the application listens on 8087, matching application.yaml.
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/communitydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
