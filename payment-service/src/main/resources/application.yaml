spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: ${JPA_SHOW_SQL}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BROKER}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${PAYMENT_SERVICE_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info

payfast:
  merchant-id: ${PAYFAST_MERCHANT_ID:}
  merchant-key: ${PAYFAST_MERCHANT_KEY:}
  passphrase: ${PAYFAST_PASSPHRASE:}
  return-url: ${PAYFAST_RETURN_URL:http://localhost:8083/api/v1/payments/webhook}
  cancel-url: ${PAYFAST_CANCEL_URL:http://localhost:8083/api/v1/payments/webhook}
  notify-url: ${PAYFAST_NOTIFY_URL:http://localhost:8083/api/v1/payments/webhook}
  sandbox-url: ${PAYFAST_SANDBOX_URL:https://sandbox.payfast.co.za/eng/process}
  currency: ${PAYFAST_CURRENCY:ZAR}
