spring:
  application:
    name: fraud-detection-service

  datasource:
    url: ${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 500

  kafka:
    bootstrap-servers: ${KAFKA_BROKER}
    consumer:
      group-id: ${KAFKA_GROUP_ID}
      auto-offset-reset: earliest 
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
           trusted:
             packages: "*"
        # spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8084

account:
  service:
    url: ${FRAUD_SERVICE_PORT}


management:
  endpoints:
    web:
      exposure:
        include: health,info

fraud:
  max-transactions-per-minute: ${MAX_TRANSACTION_PER_MINUTE}
  suspicious-amount-multiplier: ${SUSPICIOUS_AMOUNT_MULTIPLIER}
  max-balance-percentage: ${MAX_BALANCE_PERCENTAGE}

